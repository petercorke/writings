# Collect Peter's GitHub Discussions for the Blog page on petercorke.com once a day (and on
# demand): the ones he started, plus announcements, from every public repo of his that has
# Discussions on. See tools/blogfeed.py for the rules.
#
# The result, blog/discussions.json, lives on the `data` branch, not main (bot commits there
# never interrupt work on main or trigger the site build). The WordPress plugin
# wordpress/blog-feed.php fetches it from raw.githubusercontent.com, caches it for 6 hours,
# and merges it with the site's own posts. A run that finds nothing new commits nothing.
name: Blog feed

on:
  schedule:
    - cron: "30 19 * * *"   # 05:30 in Brisbane
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-feed
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Collect discussions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/blogfeed.py data/blog/discussions.json
      - name: Commit
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/discussions.json
          git diff --cached --quiet || git commit -m "Blog feed: update blog/discussions.json"
          git push origin data
