# Work out which GitHub Discussions are waiting for Peter's reply, once a week (and on demand),
# so the weekly RVC ecosystem report (which runs at 23:10 UTC) can include them. See
# tools/discussions_awaiting.py for the rule and the two tiers (recent / backlog).
#
# The result, reports/discussions-awaiting.json, lives on the `data` branch, not main.
name: Discussions awaiting reply

on:
  schedule:
    - cron: "30 22 * * 5"   # Fridays 22:30 UTC: after the RTB snapshot (22:00), before the report (23:10)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discussions-awaiting
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Find discussions awaiting a reply
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/discussions_awaiting.py data/reports/discussions-awaiting.json
      - name: Commit
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/discussions-awaiting.json
          git diff --cached --quiet || git commit -m "Discussions awaiting reply: weekly update"
          git push origin data
