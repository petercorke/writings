# Build the writings tiles page and publish it to GitHub Pages on every push to main.
#
# PDFs are rebuilt from LaTeX source where that works; otherwise the committed (published)
# PDF is used. Large PDFs live as assets on the "assets" release and are fetched here to
# render thumbnails.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out rvc-notation (LaTeX macros used by the notes)
        uses: actions/checkout@v4
        with:
          repository: petercorke/rvc-notation
          path: rvc-notation
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-science texlive-fonts-recommended texlive-plain-generic texlive-bibtex-extra biber
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Large files live on the "assets" release. Cache them between runs, keyed on the
      # release's file list, so CI only downloads them when they change; otherwise every
      # run would add to the release's download counts.
      - name: Key for the asset cache
        id: assets-key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key=$(gh release view assets --json assets --jq '[.assets[] | [.name, .size, .updatedAt]]' | sha256sum | cut -c1-16)
          echo "key=assets-$key" >> "$GITHUB_OUTPUT"
      - name: Restore cached assets
        id: assets-cache
        uses: actions/cache@v4
        with:
          path: assets
          key: ${{ steps.assets-key.outputs.key }}
      - name: Fetch large files from the "assets" release
        if: steps.assets-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download assets --dir assets --clobber || echo "no assets release yet"
      - run: python tools/build.py --check
      - run: python tools/build.py --latex
        env:
          RVC_NOTATION: ${{ github.workspace }}/rvc-notation
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
